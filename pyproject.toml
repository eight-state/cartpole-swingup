[project]
name = "quintuple-cartpole"
version = "1.0.0"
description = "First public, reproducible, verified n=5 (quintuple) inverted-pendulum-on-a-cart swing-up + balance."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.13"

# Pinned to the exact versions this release was verified with. Loosen at your
# own risk; the headline numbers were produced under these.
dependencies = [
    "casadi==3.7.2",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "matplotlib==3.10.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartpole_race"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
