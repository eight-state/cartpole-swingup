[project]
name = "quattuordecuple-cartpole"
version = "1.0.0"
description = "Deterministic exact-replay proof for a fourteen-link cart-pole swing-up."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.13"
dependencies = [
    "casadi==3.7.2",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pytest==9.0.2",
    "ruff==0.15.16",
]

[project.scripts]
n14-verify = "n14_cartpole.verifier:cli"
n14-release = "n14_cartpole.release:cli"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartpole_race", "src/n14_cartpole"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/n14_cartpole"]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["cartpole_race.*"]
follow_imports = "skip"
ignore_missing_imports = true
