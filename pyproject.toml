[project]
name = "septuple-cartpole"
version = "1.0.4"
description = "Saved-nominal n=7 cart-pole replay with audited banked evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.13"
dependencies = [
    "casadi==3.7.2",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "matplotlib==3.10.9",
]

[project.scripts]
n7-demo = "cartpole_race.release:demo_main"
n7-verify = "cartpole_race.release_audit:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartpole_race"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "src/cartpole_race/__init__.py",
    "src/cartpole_race/discrete_tvlqr.py",
    "src/cartpole_race/dynamics.py",
    "src/cartpole_race/env_spec.py",
    "src/cartpole_race/lqr.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
