[project]
name = "octuple-cartpole"
version = "1.0.0"
description = "Audited fresh unperturbed n=8 cart-pole rollout evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.13"
dependencies = [
    "casadi==3.7.2",
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "pydantic==2.13.4",
    "scipy==1.17.1",
]

[project.scripts]
n8-demo = "cartpole_race.n8:demo_main"
n8-verify = "cartpole_race.n8:verify_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.14.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartpole_race"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
