[project]
name = "sextuple-cartpole"
version = "1.0.0"
description = "Fixed-nominal N6 cart-pole closed-loop replay capsule."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11, <3.13"
dependencies = [
    "casadi==3.7.2",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.2",
    "matplotlib==3.10.9",
]

[project.scripts]
n6-demo = "cartpole_race.n6:demo_main"
n6-verify = "cartpole_race.n6:verify_main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff==0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartpole_race"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
pythonpath = ["src"]
testpaths = ["tests"]
