name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync the pinned environment
        run: uv sync --frozen
      - name: Lint the release surface
        run: uv run --locked ruff check .
      - name: Run the focused tests
        run: uv run --locked python -m pytest -q
      - name: Run the fresh demo
        run: uv run --locked n8-demo
      - name: Verify the release evidence
        run: uv run --locked n8-verify
