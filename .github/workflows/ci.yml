name: Verify monorepo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run cartpole check

  verify:
    name: n=${{ matrix.rung }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rung: 5, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 6, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 7, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 8, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 9, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 10, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 11, runner: blacksmith-2vcpu-ubuntu-2404}
          - {rung: 12, runner: blacksmith-4vcpu-windows-2025}
          - {rung: 13, runner: blacksmith-4vcpu-windows-2025}
          - {rung: 14, runner: blacksmith-4vcpu-windows-2025}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - name: Fresh shared replay
        if: matrix.rung != 14
        run: uv run cartpole verify ${{ matrix.rung }}
      - name: Host-independent authority audit
        if: matrix.rung == 14
        run: uv run cartpole verify 14 --audit-only
