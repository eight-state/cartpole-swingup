name: Verify monorepo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run cartpole check

  verify:
    name: n=${{ matrix.rung }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rung: 5, runner: ubuntu-latest}
          - {rung: 6, runner: ubuntu-latest}
          - {rung: 7, runner: ubuntu-latest}
          - {rung: 8, runner: ubuntu-latest}
          - {rung: 9, runner: ubuntu-latest}
          - {rung: 10, runner: ubuntu-latest}
          - {rung: 11, runner: ubuntu-latest}
          - {rung: 12, runner: windows-latest}
          - {rung: 13, runner: windows-latest}
          - {rung: 14, runner: windows-latest}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - run: uv run cartpole verify ${{ matrix.rung }}
