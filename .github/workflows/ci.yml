name: Repository verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/check_imports.py

  capsules-linux:
    name: ${{ matrix.capsule }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capsule: n=5
            path: capsules/n05-quintuple
            sync: uv sync --locked
            lint: uv run --locked ruff check .
            test: uv run --locked python -m pytest -q
            demo: uv run --locked n5-demo
            verify: uv run --locked n5-verify
          - capsule: n=6
            path: capsules/n06-sextuple
            sync: uv sync --locked
            lint: uv run ruff check . --select E4,E7,E9,F
            test: uv run pytest
            demo: uv run n6-demo
            verify: uv run n6-verify
          - capsule: n=7
            path: capsules/n07-septuple
            sync: uv sync --locked
            lint: uv run ruff check .
            test: uv run python -m pytest -q
            demo: uv run n7-demo
            verify: uv run n7-verify
          - capsule: n=8
            path: capsules/n08-octuple
            sync: uv sync --frozen
            lint: uv run --locked ruff check .
            test: uv run --locked python -m pytest -q
            demo: uv run --locked n8-demo
            verify: uv run --locked n8-verify
          - capsule: n=9
            path: capsules/n09-nonuple
            sync: uv sync --locked
            lint: uv run ruff check .
            test: uv run pytest
            demo: uv run n9-demo
            verify: uv run n9-verify
          - capsule: n=10
            path: capsules/n10-decuple
            sync: uv sync --locked
            lint: uv run ruff check .
            test: uv run python -m pytest -q
            demo: uv run n10-demo
            verify: uv run n10-verify
          - capsule: n=11
            path: capsules/n11-undecuple
            sync: uv sync --locked
            lint: uv run ruff check .
            test: uv run python -m pytest -q
            demo: uv run n11-demo
            verify: uv run n11-verify
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - name: Sync
        run: ${{ matrix.sync }}
        working-directory: ${{ matrix.path }}
      - name: Lint
        run: ${{ matrix.lint }}
        working-directory: ${{ matrix.path }}
      - name: Test
        run: ${{ matrix.test }}
        working-directory: ${{ matrix.path }}
      - name: Run demonstration
        run: ${{ matrix.demo }}
        working-directory: ${{ matrix.path }}
      - name: Verify
        run: ${{ matrix.verify }}
        working-directory: ${{ matrix.path }}

  capsules-windows:
    name: ${{ matrix.capsule }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - capsule: n=12
            path: capsules/n12-duodecuple
            lint: uv run ruff check .
            test: uv run pytest
            demo: uv run n12-demo
            verify: uv run n12-verify
          - capsule: n=13
            path: capsules/n13-tredecuple
            lint: uv run ruff check .
            test: uv run pytest
            demo: uv run n13-demo
            verify: uv run n13-proof-verify
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - name: Sync
        run: uv sync --locked
        working-directory: ${{ matrix.path }}
      - name: Lint
        run: ${{ matrix.lint }}
        working-directory: ${{ matrix.path }}
      - name: Test
        run: ${{ matrix.test }}
        working-directory: ${{ matrix.path }}
      - name: Run demonstration
        run: ${{ matrix.demo }}
        working-directory: ${{ matrix.path }}
      - name: Verify
        run: ${{ matrix.verify }}
        working-directory: ${{ matrix.path }}

  n14-authority:
    name: n=14 authority
    runs-on: windows-latest
    defaults:
      run:
        working-directory: capsules/n14-quattuordecuple
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not numerical_replay"
      - name: Audit retained release authority
        run: >-
          uv run python -c "from n14_cartpole.release_audit import audit_release;
          result = audit_release(); print(result);
          raise SystemExit(result['verdict'] != 'PASS')"
