name: verification

on:
  push:
    branches: [main, feat/n11-publish]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync the locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Run focused tests
        run: uv run python -m pytest -q
      - name: Run the fresh demo
        run: uv run n11-demo
      - name: Audit evidence and rerun the live stack
        run: uv run n11-verify
