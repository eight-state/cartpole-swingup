name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint the release surface
        run: uv run --locked ruff check .
      - name: Run focused tests
        run: uv run --locked python -m pytest -q
      - name: Run one fresh demo
        run: uv run --locked n5-demo
      - name: Audit the release evidence
        run: uv run --locked n5-verify
