name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync locked environment
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Focused tests
        run: uv run pytest
      - name: Fresh rendered replay
        run: uv run n6-demo
      - name: Historical audit and fresh proof
        run: uv run n6-verify
