name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  n14:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -m "not numerical_replay"
      - name: Audit frozen artifacts and source closure
        run: >-
          uv run python -c "from n14_cartpole.release_audit import audit_release;
          result = audit_release(); print(result);
          raise SystemExit(result['verdict'] != 'PASS')"
